<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 Season Projections</title>
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --success:        #006300;

    --series-1: #2a78d6; /* blue */
    --series-2: #eb6834; /* orange */
    --series-3: #1baf7a; /* aqua */
    --series-4: #eda100; /* yellow */
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page-plane:     #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --success:        #0ca30c;

      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page-plane);
    color: var(--text-primary);
  }
  header {
    padding: 32px 24px 16px;
    max-width: 1100px;
    margin: 0 auto;
  }
  header h1 { font-size: 1.6rem; margin: 0 0 4px; }
  header p { color: var(--text-secondary); margin: 0; font-size: 0.95rem; }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px 64px;
  }

  section {
    margin-top: 40px;
  }
  section h2 {
    font-size: 1.15rem;
    margin: 0 0 4px;
  }
  section .subtitle {
    color: var(--text-secondary);
    font-size: 0.88rem;
    margin: 0 0 16px;
  }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }

  .tile-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
  }
  .tile {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .tile .label {
    color: var(--text-muted);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 6px;
  }
  .tile .value {
    font-size: 1.6rem;
    font-variant-numeric: tabular-nums;
  }
  .tile .sub {
    color: var(--text-secondary);
    font-size: 0.82rem;
    margin-top: 4px;
  }

  .bars {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bar-row {
    display: grid;
    grid-template-columns: 140px 1fr 70px;
    align-items: center;
    gap: 10px;
    font-size: 0.88rem;
  }
  .bar-row .bar-label {
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .bar-row .swatch {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .bar-track {
    background: var(--gridline);
    border-radius: 4px;
    height: 14px;
    position: relative;
  }
  .bar-fill {
    height: 100%;
    border-radius: 4px;
  }
  .bar-row .bar-value {
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--text-primary);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }
  th, td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--gridline);
    font-variant-numeric: tabular-nums;
  }
  th {
    color: var(--text-muted);
    font-weight: 600;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  th:hover { color: var(--text-primary); }
  th.sorted::after { content: " \25BE"; }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; }

  .table-wrap {
    overflow-x: auto;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px 16px;
  }

  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 760px) {
    .two-col { grid-template-columns: 1fr; }
  }

  /* Cross-page navigation. Added 2026-08-31 with explicit approval to touch
     this otherwise-frozen file (CLAUDE.md section 9); scoped to a nav strip so
     no table, data or render logic is affected. */
  .sitenav {
    display: flex;
    gap: 6px;
    padding: 10px 0 0;
  }
  .sitenav a {
    border: 1px solid var(--border);
    background: var(--surface-1);
    color: var(--text-secondary);
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    text-decoration: none;
  }
  .sitenav a.current {
    color: var(--text-primary);
    border-color: var(--series-1);
    font-weight: 600;
  }
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }
  .tab-btn {
    border: 1px solid var(--border);
    background: var(--surface-1);
    color: var(--text-secondary);
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .tab-btn.active {
    color: var(--text-primary);
    border-color: var(--series-1);
    font-weight: 600;
  }
  .panel[hidden] { display: none; }

  .filter-row {
    margin-bottom: 12px;
  }
  .filter-row input {
    width: 100%;
    max-width: 280px;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface-1);
    color: var(--text-primary);
    font-size: 0.85rem;
  }

  footer {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px 40px;
    color: var(--text-muted);
    font-size: 0.78rem;
  }

  .error-neg { color: var(--series-1); }
  .error-pos { color: var(--series-2); }
</style>
</head>
<body>

<header>
  <h1>2026 Season Projections</h1>
  <p id="source-line">Loading&hellip;</p>
  <nav class="sitenav">
    <a href="draft.html">Draft board</a>
    <a href="weekly.html">Weekly</a>
  </nav>
</header>

<main>

<div class="panel" id="panel-2026">

  <section id="section-2026">
    <h2>2026 season projections</h2>
    <p class="subtitle">Full-season fantasy-point projections from the current model, with floor/ceiling range.</p>
    <div class="tabs" id="pos-tabs"></div>
    <div class="filter-row"><input type="text" id="player-filter" placeholder="Filter by player or team&hellip;"></div>
    <div class="table-wrap"><table id="table-2026"></table></div>
  </section>

</div>

</main>

<footer>
  Static data generated by <code>scripts/generate_results_page.py</code>. Not updated automatically.
</footer>

<script>
const SERIES_COLORS = ['var(--series-1)', 'var(--series-2)', 'var(--series-3)', 'var(--series-4)'];

function fmt(n, digits = 1) {
  if (n === null || n === undefined || Number.isNaN(n)) return '—';
  return Number(n).toFixed(digits);
}

function pct(n, digits = 1) {
  if (n === null || n === undefined || Number.isNaN(n)) return '—';
  return (Number(n) * 100).toFixed(digits) + '%';
}

function renderBars(containerId, rows, valueKey, maxValue, formatter = fmt) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  rows.forEach((row, i) => {
    const pctWidth = Math.max(2, (row[valueKey] / maxValue) * 100);
    const div = document.createElement('div');
    div.className = 'bar-row';
    div.innerHTML = `
      <span class="bar-label"><span class="swatch" style="background:${SERIES_COLORS[i % 4]}"></span>${row.label}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${pctWidth}%;background:${SERIES_COLORS[i % 4]}"></span></span>
      <span class="bar-value">${formatter(row[valueKey])}</span>
    `;
    el.appendChild(div);
  });
}

let projectionsData = [];
let currentPos = 'ALL';
// VOR, not raw points: raw points rank six QBs in the top ten, which is
// accurate scoring and poor draft advice. Computed in
// scripts/generate_results_page.py so this table and docs/draft.html cannot
// disagree about who is best.
let sortKey = 'vor';
let sortDir = -1;

function renderProjectionsTable() {
  const filterText = document.getElementById('player-filter').value.trim().toLowerCase();
  let rows = projectionsData.filter(p => currentPos === 'ALL' || p.position === currentPos);
  if (filterText) {
    rows = rows.filter(p =>
      (p.name || '').toLowerCase().includes(filterText) ||
      (p.team || '').toLowerCase().includes(filterText)
    );
  }
  rows = rows.slice().sort((a, b) => {
    const av = a[sortKey] ?? -Infinity;
    const bv = b[sortKey] ?? -Infinity;
    if (typeof av === 'string') return sortDir * av.localeCompare(bv);
    return sortDir * (av - bv);
  });
  rows = rows.slice(0, 100);

  const columns = [
    ['name', 'Player'], ['team', 'Team'], ['position', 'Pos'], ['adp', 'ADP'],
    ['vor', 'VOR'], ['projection_total', 'Proj Total'], ['projection_ppg', 'Proj PPG'],
    ['floor', 'Floor'], ['ceiling', 'Ceiling'], ['risk_score', 'Risk'],
  ];
  const numCols = new Set(['adp', 'vor', 'projection_total', 'projection_ppg', 'floor', 'ceiling', 'risk_score']);

  const table = document.getElementById('table-2026');
  table.innerHTML = `
    <thead><tr>
      ${columns.map(([key, label]) => `
        <th class="${numCols.has(key) ? 'num' : ''} ${sortKey === key ? 'sorted' : ''}" data-key="${key}">${label}</th>
      `).join('')}
    </tr></thead>
    <tbody>
      ${rows.map(p => `
        <tr>
          <td>${p.name}</td>
          <td>${p.team || ''}</td>
          <td>${p.position}</td>
          <td class="num">${p.adp ?? '—'}</td>
          <td class="num">${fmt(p.vor, 1)}</td>
          <td class="num">${fmt(p.projection_total, 0)}</td>
          <td class="num">${fmt(p.projection_ppg, 1)}</td>
          <td class="num">${fmt(p.floor, 0)}</td>
          <td class="num">${fmt(p.ceiling, 0)}</td>
          <td class="num">${fmt(p.risk_score, 0)}</td>
        </tr>
      `).join('')}
    </tbody>
  `;

  table.querySelectorAll('th[data-key]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (sortKey === key) {
        sortDir *= -1;
      } else {
        sortKey = key;
        sortDir = -1;
      }
      renderProjectionsTable();
    });
  });
}

async function main() {
  // Backtest-validation rendering was removed with its panel; only the 2026
  // projections remain. backtest_2025.json is still generated and still read
  // by scripts/audit_2025_backtest.py and friends -- it is simply no longer
  // surfaced here.
  const projections = await fetch('data/projections_2026.json').then(r => r.json());

  document.getElementById('source-line').textContent =
    `${projections.length} players projected for 2026 · Step 8 season model`;

  // 2026 projections
  projectionsData = projections;
  const tabsEl = document.getElementById('pos-tabs');
  ['ALL', 'QB', 'RB', 'WR', 'TE'].forEach(pos => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (pos === currentPos ? ' active' : '');
    btn.textContent = pos;
    btn.addEventListener('click', () => {
      currentPos = pos;
      tabsEl.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProjectionsTable();
    });
    tabsEl.appendChild(btn);
  });
  document.getElementById('player-filter').addEventListener('input', renderProjectionsTable);
  renderProjectionsTable();
}

main();
</script>

</body>
</html>
