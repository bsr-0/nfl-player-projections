name: Notify hub

on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch: {}

# Fires a `source-updated` repository_dispatch at bsr-0/prediction-models so
# the hub rebuilds and republishes this project's site. Requires the secret
# HUB_DISPATCH_TOKEN: a fine-grained PAT scoped to prediction-models with
# Contents: read & write (repository_dispatch needs write).
#
# `push` covers commits you make by hand. `workflow_run` covers commits made
# by our own workflows: pushes done with GITHUB_TOKEN never fire `push`, but
# the completion of the workflow that made them does.

jobs:
  notify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch hub refresh
        env:
          GH_TOKEN: ${{ secrets.HUB_DISPATCH_TOKEN }}
        run: |
          reason="${{ github.event_name }}"
          if [ "$reason" = "workflow_run" ]; then
            reason="workflow_run: ${{ github.event.workflow_run.name }}"
          fi
          gh api repos/bsr-0/prediction-models/dispatches \
            -f event_type=source-updated \
            -f "client_payload[repo]=${{ github.repository }}" \
            -f "client_payload[reason]=$reason" \
            -f "client_payload[sha]=${{ github.sha }}"
